name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Xcode 26 or later: its `swift build` compiles the Metal shaders.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: swift build
      - name: Test
        run: swift test
